[project]
site_name = "Ri-Wiki"
site_description = "База знаний о всём, что связанно с ПК"
site_url = "https://rivzor.github.io/ri-wiki/"
site_author = "rivzor"
copyright = "Copyright &copy; 2025 rivzor"

docs_dir = "docs"
site_dir = "site"

repo_url = "https://github.com/rivzor/ri-wiki"
repo_name = "rivzor/ri-wiki"
edit_uri = "edit/main/docs/"

nav = [
    { "Главная" = "index.md" },
    { "Руководства" = [
        { "Windows" = [
            "content/windows/download.md",
            "content/windows/install.md",
            "content/windows/activation.md",
            { "Оптимизация" = [
            "content/windows/optimization.md",
            "content/windows/autounattend.md",
            ] },
        ]},
        { "Полезное для ПК" = [
            { "Лучший софт" = [ 
                "content/software/pc/index.md", 
                "content/software/pc/rufus.md",
                "content/software/pc/peazip.md",
                "content/software/pc/7zip.md",
                "content/software/pc/potplayer.md",
                "content/software/pc/wiztree.md",
                ]}
            ]},
        { "Полезное для Андроид" = [
            { "Лучшие АПК" = [
                "content/software/android/index.md",]}
            ]},
    ]},
    { "Разное" = [
        "content/other/adblock.md",
    ]},
]

extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = ["assets/javascript/extra.js"]

# ----------------------------------------------------------------------------
# Section for configuring theme options
# ----------------------------------------------------------------------------
[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "assets/logo.png"
favicon = "assets/logo.png"
language = "ru"


features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant.prefetch",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# ----------------------------------------------------------------------------
# "palette"
# ----------------------------------------------------------------------------
# Palette toggle for dark mode
[[project.theme.palette]]
primary = "red"
accent = "pink"
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/toggle-right"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
primary = "red"
accent = "pink"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/toggle-left"
toggle.name = "Switch to dark mode"


# ----------------------------------------------------------------------------
# "font"
# ----------------------------------------------------------------------------
[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings.
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "simple/github"
link = "https://github.com/rivzor"

[[project.extra.social]]
icon = "simple/telegram"
link = "https://t.me/rivzor"

[[project.extra.social]]
icon = "simple/maildotru"
link = "mailto:i@rivzor.ru"

[project.extra.consent]
title = "Cookie соглашение"
description = """
    Мы используем файлы cookie, чтобы распознавать ваши повторные посещения и предпочтения, 
    а также для оценки эффективности нашей документации и того, находят ли пользователи то, что ищут. 
    С вашего согласия вы помогаете нам улучшать нашу документацию.
"""

[project.extra.status]
new = "Новое"
deprecated = "Не актуально"
hot = "Горячее"

[project.extra]
generator = false
alternate = [
    { name = "Русский", lang = "ru" },
    { name = "English", link = "/ri-wiki/en/", lang = "en" },
]

[project.markdown_extensions.toc]
permalink =  "#"
permalink_title = "Ссылка на этот раздел"
title = "На этой странице"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }   

[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji" 
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.magiclink]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.tilde]



